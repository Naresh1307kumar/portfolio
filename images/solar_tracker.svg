<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-solar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="100%" stop-color="#132e42"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-solar)"/>

  <!-- Sun Source with rays -->
  <circle cx="620" cy="110" r="42" fill="url(#sun-grad)"/>
  <circle cx="620" cy="110" r="56" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="620" y="180" text-anchor="middle" fill="#fbbf24" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="bold">SUN AZIMUTH: 138&#176;</text>

  <!-- Ray lines toward panel -->
  <line x1="580" y1="140" x2="390" y2="240" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>
  <line x1="610" y1="160" x2="440" y2="230" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Tracking Mechanism / Solar Panel -->
  <g transform="translate(300, 200) rotate(-18)">
    <rect x="0" y="0" width="200" height="100" rx="6" fill="url(#panel-grad)" stroke="#60a5fa" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#3b82f6" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="100" stroke="#3b82f6" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="100" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="50" x2="200" y2="50" stroke="#3b82f6" stroke-width="1"/>
    <!-- LDR Sensors -->
    <circle cx="10" cy="10" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="190" cy="10" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <!-- Mount stand -->
  <rect x="380" y="300" width="24" height="90" rx="2" fill="#475569" stroke="#94a3b8"/>
  <polygon points="320,390 460,390 430,370 350,370" fill="#334155"/>

  <!-- Real-time Telemetry Overlay Card -->
  <rect x="40" y="40" width="280" height="360" rx="12" fill="#0c1e2b" stroke="#215070" stroke-width="1.5"/>
  <text x="60" y="72" fill="#38bdf8" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold">&#9881;&#65039; AUTOMATIC SOLAR TRACKER</text>
  <text x="60" y="92" fill="#8bb2c9" font-family="Space Grotesk, sans-serif" font-size="11">Dynamic Dual-Axis Positioning</text>

  <rect x="60" y="115" width="240" height="56" rx="6" fill="#11293a"/>
  <text x="75" y="136" fill="#8bb2c9" font-family="Space Grotesk, sans-serif" font-size="10">EFFICIENCY GAIN</text>
  <text x="75" y="160" fill="#10b981" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="bold">+38.5% Boost</text>

  <rect x="60" y="185" width="240" height="80" rx="6" fill="#11293a"/>
  <text x="75" y="206" fill="#8bb2c9" font-family="Space Grotesk, sans-serif" font-size="10">SENSOR TELEMETRY (LDR)</text>
  <text x="75" y="228" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">Sensor East: 942 Lux (Active)</text>
  <text x="75" y="248" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">Sensor West: 410 Lux (Shadow)</text>

  <rect x="60" y="280" width="240" height="95" rx="6" fill="#11293a"/>
  <text x="75" y="302" fill="#8bb2c9" font-family="Space Grotesk, sans-serif" font-size="10">SERVO CONTROLLER</text>
  <text x="75" y="324" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">Correction: Auto-Aligning</text>
  <text x="75" y="344" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">Motor Step: 1.8&#176; / 15 sec</text>
  <text x="75" y="362" fill="#10b981" font-family="Space Grotesk, sans-serif" font-size="10">&#9679; Microcontroller Online</text>
</svg>