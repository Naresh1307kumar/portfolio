    <text x="380" y="32" fill="#10b981" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold">&#128737;&#65039; Insurance Pre-Approval Check</text>
    <rect x="380" y="50" width="300" height="60" rx="6" fill="#122a3d"/>
