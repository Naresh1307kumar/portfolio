  </defs>
  <rect width="800" height="500" fill="url(#bg-medi)"/>
  <!-- Browser Chrome -->
  <rect x="30" y="30" width="740" height="440" rx="14" fill="#0a1824" stroke="#1c3a54" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="44" rx="14" fill="#12283a"/>
  <circle cx="55" cy="52" r="6" fill="#ef4444"/>
  <circle cx="75" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="52" r="6" fill="#10b981"/>
