    <text x="20" y="32" fill="#38bdf8" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold">&#128680; Rapid Ambulance Tracker</text>
    <rect x="20" y="50" width="290" height="110" rx="6" fill="#122a3d" stroke="#1c4363"/>
