    <text x="395" y="150" fill="#8bb2c9" font-family="Space Grotesk, sans-serif" font-size="10">VERIFIED NETWORK HOSPITALS</text>
    <text x="395" y="174" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">&#10003; City Medical Research Hospital (0.8 km)</text>
