    <text x="240" y="145" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="12">&#8377;20,000</text>
    <text x="340" y="145" fill="#10b981" font-family="Space Grotesk, sans-serif" font-size="12">&#8377;3,280</text>
